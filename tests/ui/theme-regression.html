<!doctype html>
<!-- Browser regression harness: build/run BdoGrindTracker.BrowserPreview, copy
     this file into its bin/Debug/net9.0/wwwroot directory, then open
     http://127.0.0.1:5180/theme-regression.html. Uses the built application CSS.
     PASS requires every nested theme and negative EXP color check to succeed. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grindcrest theme regression</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/overlay-editor.css">
  <link rel="stylesheet" href="/overlay-widgets.css">
  <link rel="stylesheet" href="/themes.css">
  <style>
    html, body { height: auto; min-height: 100%; overflow: auto; }
    #report { max-width: 1200px; margin: 32px auto; padding: 0 24px; font: 14px/1.5 system-ui, sans-serif; }
    #report h1 { font-size: 26px; margin-bottom: 12px; }
    #report p { margin-bottom: 12px; }
    #report table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    #report th, #report td { border: 1px solid #47505e; padding: 6px 10px; text-align: left; vertical-align: top; }
    #report .pass { color: #8bd9a2; }
    #report .fail { color: #ffadad; }
    #report pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    #summary { padding: 16px; border: 2px solid currentColor; border-radius: 8px; font-weight: 700; }
    #fixtures { position: absolute; left: -20000px; top: 0; width: 1400px; pointer-events: none; }
    #fixtures .theme-surface { background-color: var(--bg); }
    #fixtures .probe { width: 400px; }
    #fixtures .oe-stage { width: 300px; height: 140px; }
    #fixtures .overlay-widget-preview { position: relative; width: 270px; height: 90px; }
    #fixtures .oe-slot { width: 60px; height: 60px; }
  </style>
</head>
<body>
  <main id="report">
    <h1>Grindcrest theme regression</h1>
    <p>Real application CSS, standalone references and all 49 nested main-window/overlay combinations. Computed styles are read by this page.</p>
    <div id="summary" role="status">RUNNING — waiting for stylesheets</div>
    <p id="environment"></p>
    <details id="failures"><summary>Failure details</summary><pre id="failure-details">None</pre></details>
    <table>
      <thead><tr><th>Case</th><th>Result</th><th>Assertions</th></tr></thead>
      <tbody id="results"></tbody>
    </table>
  </main>
  <div id="fixtures" aria-hidden="true"></div>
  <script>
    "use strict";
    const themes = ["grindcrest", "black-desert", "light", "cats", "obsidian", "kamasylvia", "valencia"];
    const expected = {
      grindcrest: { bg: "#101318", text: "#e6e8ed", gold: "#ddb76b", scheme: "dark", surface: "23,29,34" },
      "black-desert": { bg: "#101112", text: "#e6dfcd", gold: "#d3b675", scheme: "dark", surface: "18,19,21" },
      light: { bg: "#f5f6f8", text: "#243244", gold: "#365f91", scheme: "light", surface: "245,246,248", red: "#a43d43" },
      cats: { bg: "#25221f", text: "#f5eddf", gold: "#e0b97f", scheme: "dark", surface: "37,34,31", red: "#eaa999" },
      obsidian: { bg: "#101216", text: "#f1f4f8", gold: "#9fc5ff", scheme: "dark", surface: "16,18,22" },
      kamasylvia: { bg: "#14231e", text: "#f1efda", gold: "#d8ca8a", scheme: "dark", surface: "20,35,30" },
      valencia: { bg: "#f3eadb", text: "#433226", gold: "#9c482d", scheme: "light", surface: "243,234,219", red: "#a03235" }
    };
    const results = [], failures = [];
    let assertions = 0;
    const normalize = value => value.trim().toLowerCase().replace(/\s+/g, "");
    const rgb = hex => `rgb(${parseInt(hex.slice(1, 3), 16)}, ${parseInt(hex.slice(3, 5), 16)}, ${parseInt(hex.slice(5, 7), 16)})`;
    function assertEqual(label, actual, target) {
      assertions++;
      if (normalize(actual) !== normalize(target)) failures.push(`${label}: expected ${JSON.stringify(target)}, got ${JSON.stringify(actual)}`);
    }
    function caseResult(name, run) {
      const start = assertions, failureStart = failures.length;
      try { run(); } catch (error) { failures.push(`${name}: ${error.stack || error}`); }
      results.push({ name, passed: failures.length === failureStart, assertions: assertions - start, failures: failures.slice(failureStart) });
    }
    function makeProbe(theme) {
      const probe = document.createElement("section");
      probe.className = "probe oe-stage-viewport";
      probe.dataset.theme = theme;
      probe.innerHTML = `
        <div class="theme-surface">Background and inherited text</div>
        <div class="oe-stage has-border"><div class="oe-stage-content">
          <div class="overlay-widget-preview overlay-widget-duration metric-tone-default">
            <span class="ow-value overlay-widget-value">123,456</span>
          </div>
        </div></div>
        <div class="overlay-widget-preview overlay-widget-silver metric-tone-accent"><span class="accent-value overlay-widget-value">1.23 B</span></div>
        <div class="overlay-widget-items is-grid"><div class="oe-slot overlay-widget-item"><span class="overlay-item-quantity">123</span></div></div>
        <div class="experience-live-value is-loss"><strong class="experience-gain">−0.123 %</strong><span class="experience-hourly">−0.246 % / h</span></div>
        <div class="session-experience-column is-loss"><strong class="experience-gain">−0.123 %</strong><span class="experience-hourly">−0.246 % / h</span></div>
        <div class="chronological-session-header"><div class="chronological-session-experience is-loss"><strong class="experience-gain">−0.123 %</strong><small class="experience-hourly">−0.246 % / h</small></div></div>`;
      return probe;
    }
    function snapshot(probe) {
      const root = getComputedStyle(probe);
      const css = selector => getComputedStyle(probe.querySelector(selector));
      const fields = {
        "token bg": root.getPropertyValue("--bg"),
        "token text": root.getPropertyValue("--text"),
        "token accent": root.getPropertyValue("--gold"),
        "token surface": root.getPropertyValue("--overlay-surface-rgb"),
        "token daily track": root.getPropertyValue("--daily-track"),
        "token daily fill": root.getPropertyValue("--daily-fill"),
        "token daily ink": root.getPropertyValue("--daily-ink"),
        "token rotation line": root.getPropertyValue("--rotation-line"),
        "color scheme": root.colorScheme,
        "scope text": root.color,
        "background": css(".theme-surface").backgroundColor,
        "viewport background": root.backgroundColor,
        "viewport grid": root.backgroundImage,
        "stage background": css(".oe-stage").backgroundColor,
        "stage border": css(".oe-stage").borderTopColor,
        "widget value": css(".ow-value").color,
        "accent value": css(".accent-value").color,
        "slot quantity": css(".oe-slot .overlay-item-quantity").color,
        "slot quantity shadow": css(".oe-slot .overlay-item-quantity").textShadow,
        "slot background": css(".oe-slot").backgroundColor,
        "cat illustration": getComputedStyle(probe.querySelector(".oe-stage-content"), "::before").content
      };
      return fields;
    }
    function checkPalette(label, probe, theme) {
      const values = snapshot(probe), wanted = expected[theme];
      assertEqual(`${label} bg token`, values["token bg"], wanted.bg);
      assertEqual(`${label} text token`, values["token text"], wanted.text);
      assertEqual(`${label} accent token`, values["token accent"], wanted.gold);
      assertEqual(`${label} surface token`, values["token surface"], wanted.surface);
      assertEqual(`${label} color scheme`, values["color scheme"], wanted.scheme);
      assertEqual(`${label} background paint`, values.background, rgb(wanted.bg));
      assertEqual(`${label} inherited text paint`, values["scope text"], rgb(wanted.text));
      if (!["grindcrest"].includes(theme)) assertEqual(`${label} accent value paint`, values["accent value"], rgb(wanted.gold));
      if (!["grindcrest", "black-desert"].includes(theme)) {
        assertEqual(`${label} widget value paint`, values["widget value"], rgb(wanted.text));
        assertEqual(`${label} quantity paint`, values["slot quantity"], rgb(wanted.text));
      }
      if (theme === "grindcrest") {
        assertEqual(`${label} default daily track reset`, values["token daily track"], "#f2c76c3c");
        assertEqual(`${label} default daily fill reset`, values["token daily fill"], "#806836");
        assertEqual(`${label} default daily ink reset`, values["token daily ink"], "#edf1f5");
        assertEqual(`${label} default rotation reset`, values["token rotation line"], "#929daa");
      }
    }
    function checkLosses(label, probe, theme) {
      if (!expected[theme].red) return;
      for (const location of [".experience-live-value", ".session-experience-column", ".chronological-session-header"]) {
        const wanted = location === ".chronological-session-header" && theme !== "cats" ? "#ffb4af" : expected[theme].red;
        for (const metric of [".experience-gain", ".experience-hourly"]) {
          assertEqual(`${label} ${location} ${metric} loss`, getComputedStyle(probe.querySelector(`${location} ${metric}`)).color, rgb(wanted));
        }
      }
    }
    function run() {
      const fixtures = document.getElementById("fixtures");
      const standalone = Object.fromEntries(themes.map(theme => {
        const probe = makeProbe(theme); fixtures.append(probe); return [theme, probe];
      }));
      const pairs = themes.flatMap(main => themes.map(overlay => {
        const shell = document.createElement("div");
        shell.dataset.theme = main;
        shell.className = "theme-surface";
        const probe = makeProbe(overlay);
        shell.append(probe); fixtures.append(shell);
        return { main, overlay, shell, probe };
      }));
      caseResult("Stylesheets / scope support", () => {
        for (const href of ["/app.css", "/overlay-editor.css", "/overlay-widgets.css", "/themes.css"]) {
          const sheet = [...document.styleSheets].find(value => value.href && new URL(value.href).pathname === href);
          assertEqual(`loaded ${href}`, String(Boolean(sheet && sheet.cssRules.length)), "true");
        }
        assertEqual("CSSScopeRule available", String(typeof CSSScopeRule !== "undefined"), "true");
      });
      for (const theme of themes) caseResult(`Standalone ${theme}`, () => {
        checkPalette(`standalone ${theme}`, standalone[theme], theme);
        checkLosses(`standalone ${theme}`, standalone[theme], theme);
      });
      for (const { main, overlay, shell, probe } of pairs) caseResult(`${main} → ${overlay}`, () => {
        checkPalette(`${main} → ${overlay}`, probe, overlay);
        checkLosses(`${main} → ${overlay}`, probe, overlay);
        assertEqual(`${main} shell keeps bg`, getComputedStyle(shell).getPropertyValue("--bg"), expected[main].bg);
        assertEqual(`${main} shell keeps text`, getComputedStyle(shell).getPropertyValue("--text"), expected[main].text);
        const actual = snapshot(probe), reference = snapshot(standalone[overlay]);
        for (const key of Object.keys(reference)) assertEqual(`${main} → ${overlay} ${key} matches standalone`, actual[key], reference[key]);
      });
      const summary = document.getElementById("summary"), passed = failures.length === 0;
      summary.className = passed ? "pass" : "fail";
      summary.textContent = `${passed ? "PASS" : "FAIL"} — ${results.filter(result => result.passed).length}/${results.length} cases; ${assertions} assertions; ${failures.length} failures; all 49 theme pairs checked`;
      document.title = `${passed ? "PASS" : "FAIL"} — Grindcrest theme regression`;
      document.body.dataset.testResult = passed ? "pass" : "fail";
      document.getElementById("environment").textContent = `${new Date().toISOString()} · ${navigator.userAgent}`;
      document.getElementById("failure-details").textContent = failures.length ? failures.join("\n\n") : "None";
      document.getElementById("failures").open = !passed;
      for (const result of results) {
        const row = document.createElement("tr");
        for (const text of [result.name, result.passed ? "PASS" : "FAIL", String(result.assertions)]) {
          const cell = document.createElement("td"); cell.textContent = text; row.append(cell);
        }
        row.children[1].className = result.passed ? "pass" : "fail";
        document.getElementById("results").append(row);
      }
      window.themeRegressionResults = { passed, assertions, themePairs: pairs.length, cases: results, failures };
    }
    window.addEventListener("load", () => requestAnimationFrame(() => requestAnimationFrame(() => {
      try { run(); } catch (error) {
        document.getElementById("summary").textContent = `FAIL — ${error.stack || error}`;
        document.getElementById("summary").className = "fail";
        document.body.dataset.testResult = "fail";
      }
    })), { once: true });
  </script>
</body>
</html>

name: Build Grindcrest for Microsoft Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable app version, for example 1.0.0 (Store package becomes 1.0.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: grindcrest-store-package
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'
      - name: Test and build Store submission package
        env:
          STORE_VERSION: ${{ inputs.version }}
        run: ./scripts/Build-StoreRelease.ps1 -Version $env:STORE_VERSION -OutputDirectory ./artifacts/store-upload
      - name: Save Store submission package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grindcrest-store-package
          path: artifacts/store-upload/*
          if-no-files-found: error
          retention-days: 30
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: store-test-results
          path: artifacts/store-work/**/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 14

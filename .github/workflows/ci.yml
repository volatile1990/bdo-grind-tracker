name: Test Grindcrest

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grindcrest-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  browser-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'
      - name: Test portable browser host and shared overlay rendering
        run: dotnet test tests/BdoGrindTracker.BrowserPreview.Tests -c Release --nologo
      - name: Publish browser preview
        run: dotnet publish src/BdoGrindTracker.BrowserPreview -c Release --nologo -o artifacts/browser-preview
  test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Test UI interactions
        run: ./scripts/Test-Ui.ps1
      - name: Test packaged runtime validation
        run: ./scripts/tests/Test-PackagedRuntime.Tests.ps1
      - name: Test Windows application
        run: dotnet test BdoGrindTracker.slnx -c Release --nologo --logger trx --results-directory artifacts/test-results
      - name: Save results, including missing native OCR prerequisites
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: error
          retention-days: 14
